name: Android

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secretos opcionales (Settings → Secrets and variables → Actions):
      #   GOOGLE_SERVICES_JSON       contenido de app/google-services.json (activa el modo nube)
      #   MIGASTO_KEYSTORE_BASE64    keystore de subida en base64
      #   MIGASTO_KEYSTORE_PASSWORD  contraseña del keystore
      #   MIGASTO_KEY_ALIAS          alias de la clave (migasto)
      #   MIGASTO_KEY_PASSWORD       contraseña de la clave
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_KEYSTORE: ${{ secrets.MIGASTO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Configuración de Firebase (modo nube)
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Keystore de firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MIGASTO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "MIGASTO_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Tests unitarios y capturas
        run: ./gradlew :app:testDebugUnitTest

      - name: Compilar APK y AAB de release
        env:
          MIGASTO_KEYSTORE_PASSWORD: ${{ secrets.MIGASTO_KEYSTORE_PASSWORD }}
          MIGASTO_KEY_ALIAS: ${{ secrets.MIGASTO_KEY_ALIAS }}
          MIGASTO_KEY_PASSWORD: ${{ secrets.MIGASTO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease


      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiGasto-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: MiGasto-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/

      - name: Informe de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  cloud:
    name: Reglas de Firestore y modo nube (emuladores)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        working-directory: firebase-tests
        run: npm ci

      - name: Reglas de seguridad
        working-directory: firebase-tests
        run: npm test

      - name: Repositorios Android contra los emuladores
        working-directory: firebase-tests
        run: npm run test:android
